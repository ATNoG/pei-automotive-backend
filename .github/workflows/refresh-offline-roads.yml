## refresh-offline-roads workflow
# Daily cron that resumes the Aveiro-district road snapshot build.
# Each run processes a small batch of tiles (capped) and commits any
# changes back to main. See scripts/build_offline_roads.py for details.

name: Refresh offline roads

on:
    schedule:
        - cron: "0 3 * * *"   # daily at 03:00 UTC
    workflow_dispatch:

jobs:
    refresh:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install requests
              run: pip install --upgrade requests

            - name: Run incremental builder
              run: python3 scripts/build_offline_roads.py

            - name: Commit and push if changed
              run: |
                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/common/offline_roads.json scripts/offline_roads_manifest.json
                  if git diff --cached --quiet; then
                      echo "No changes to commit."
                      exit 0
                  fi
                  done=$(python3 -c "import json; m=json.load(open('scripts/offline_roads_manifest.json')); t=m['tiles']; print(sum(1 for v in t.values() if v['status']=='done'), len(t))")
                  git commit -m "chore: refresh offline roads (${done} tiles done)"
                  git push origin main
