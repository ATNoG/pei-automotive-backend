name: secrets

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types: [opened, synchronize, reopened]

jobs:
    gitleaks:
        name: scan (gitleaks)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history for all branches

            - name: Run Gitleaks
              uses: docker://gitleaks/gitleaks:latest
              with:
                  args: detect --source . --verbose --redact
