allow_anonymous false

# go-auth plugin (pinned to 3.0.0-mosquitto_2.0.18 — see docker-compose.yml)
auth_plugin /mosquitto/go-auth.so

# Two backends in priority order:
#   1. files  — backend microservices authenticate with username/password
#   2. jwt    — Android clients authenticate with their Keycloak access token
auth_opt_backends files,jwt

# Files backend — handles user auth for backend services and ACL for all clients.
auth_opt_files_register user,acl
auth_opt_files_password_path /tmp/passwd
auth_opt_files_acl_path /mosquitto/config/acl

# JWT backend — handles user auth for Android clients (not ACL).
auth_opt_jwt_register user
auth_opt_jwt_mode remote
auth_opt_jwt_host keycloak
auth_opt_jwt_port 8080
auth_opt_jwt_http_method GET
auth_opt_jwt_response_mode status
auth_opt_jwt_getuser_uri /realms/automotive-app/protocol/openid-connect/userinfo
auth_opt_jwt_aclcheck_uri /realms/automotive-app/protocol/openid-connect/userinfo

# ── Listeners ───────────────────────────────────────────────────────────────
# Plain MQTT for backend microservices on the internal Docker network.
listener 1883

# WebSocket listener for Android clients connecting via IT nginx
listener 9001 0.0.0.0
protocol websockets
