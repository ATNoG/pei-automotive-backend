services:
    mosquitto_broker:
        image: eclipse-mosquitto:2
        ports:
            - "${MQTT_PORT:-1884}:1883"
        volumes:
            - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

    position_processor:
        build:
            context: .
            dockerfile: src/services/position_processor/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            - mosquitto_broker

    speed_detector:
        build:
            context: .
            dockerfile: src/services/speed_detector/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            - mosquitto_broker
            - position_processor

    overtaking_detector:
        build:
            context: .
            dockerfile: src/services/overtaking_detector/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            - mosquitto_broker
            - position_processor

    emergency_vehicle_detector:
        build:
            context: .
            dockerfile: src/services/emergency_vehicle_detector/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            - mosquitto_broker
            - position_processor

    highway_entry_detector:
        build:
            context: .
            dockerfile: src/services/highway_entry_detector/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            - mosquitto_broker
            - position_processor

    accident_detector:
        build:
            context: .
            dockerfile: src/services/accident_detector/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            - mosquitto_broker
            - position_processor

    meteo_consumer:
        build:
            context: .
            dockerfile: src/services/meteo_consumer/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            - mosquitto_broker
        extra_hosts:
            - "tomastest.com:10.255.38.67"

    station_assigner:
        build:
            context: .
            dockerfile: src/services/station_assigner/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            - mosquitto_broker
            - position_processor
            - meteo_consumer

    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: keycloak
            POSTGRES_USER: ${KC_DB_USERNAME}
            POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
        volumes:
            - keycloak_db_data:/var/lib/postgresql/data
        networks:
            - keycloak_net
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U keycloak"]
            interval: 10s
            timeout: 5s
            retries: 5

    keycloak:
        image: quay.io/keycloak/keycloak:24.0
        environment:
            KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
            KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
            KC_DB_USERNAME: ${KC_DB_USERNAME}
            KC_DB_PASSWORD: ${KC_DB_PASSWORD}
            KC_HOSTNAME_STRICT: false
            KC_HTTP_ENABLED: true
        ports:
            - "${KC_PORT:-8081}:8080"
        command: start-dev
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - keycloak_net
        restart: unless-stopped

networks:
    keycloak_net:
        driver: bridge

volumes:
    keycloak_db_data:
